# /etc/systemd/system/prism42-vllm.service.d/10-cycle2S-gpu-memory.conf
#
# Cycle-2S+ Lever L3: raise gpu-memory-utilization from 0.20 to 0.85
# matching the NVIDIA Nemotron-3-Nano-NVFP4 cookbook recommendation.
#
# Why: HBM is at 32% used (88.7 GiB / 275 GiB). The 0.20 setting caps vLLM at
# 55 GiB total (33 GiB KV cache). Fish-Speech runs in a separate CUDA context;
# raising vLLM's budget consumes only currently-FREE memory (185 GiB free).
#
# Effect: KV cache slots 5x larger; 70x concurrency at 32K → 350x.
# Steady-state TTFT/TPOT unchanged at batch=1.
#
# Activation: install in drop-in dir, then daemon-reload + restart vLLM.
# This drop-in is for a FUTURE systemd-managed prism42-vllm.service.
# The current manual launcher needs the equivalent flag added to ExecStart.
# See drop-ins/README.md for both paths.

[Service]
# Override the launcher's --gpu-memory-utilization argument.
# Note: this is meant to MERGE with a systemd unit's existing ExecStart.
# If the unit already has ExecStart=, you'll need to override it fully:
ExecStart=
ExecStart=/opt/prism42/infra/b300/services/fish-speech/.venv-nightly/bin/vllm serve nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4 \
    --served-model-name nemotron-nano \
    --trust-remote-code \
    --tensor-parallel-size 1 \
    --max-model-len 32768 \
    --max-num-seqs 8 \
    --gpu-memory-utilization 0.85 \
    --kv-cache-dtype fp8 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser-plugin /opt/prism42/infra/b300/services/vllm/nano_v3_reasoning_parser.py \
    --reasoning-parser nano_v3 \
    --enable-prefix-caching \
    --port 8001 \
    --host 127.0.0.1
