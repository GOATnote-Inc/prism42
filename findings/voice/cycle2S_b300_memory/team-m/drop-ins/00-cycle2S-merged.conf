# /etc/systemd/system/prism42-vllm.service.d/00-cycle2S-merged.conf
#
# Cycle-2S+ ALL-IN-ONE drop-in. Merges levers L3 + L8b + L6 in a single ExecStart
# so we don't fight systemd's ExecStart= reset semantics. Use THIS instead of the
# three separate 10/20/30 files when integrating.
#
# Layers:
#   L3 (gpu-memory-utilization 0.85)  — predicted: KV cache 5x bigger, batch=1 unchanged
#   L8b (env vars persistent)         — predicted: eliminates JS-garbage failure mode
#   L6 (n-gram speculative decoding)  — predicted: decode 1.3-1.5x faster, ~40 ms/reply
#
# All three are LOW–MED risk and reversible by removing this drop-in + restart.

[Service]
# --- Lever L8b: persistent MoE backend + Blackwell arch ---
Environment="VLLM_USE_FLASHINFER_MOE_FP4=1"
Environment="VLLM_FLASHINFER_MOE_BACKEND=throughput"
Environment="VLLM_ATTENTION_BACKEND=FLASHINFER"
Environment="TORCH_CUDA_ARCH_LIST=10.0;10.3"
# Optional, populate before install:
# Environment="HF_TOKEN=hf_xxx"

# --- Levers L3 + L6: vLLM CLI flags ---
ExecStart=
ExecStart=/opt/prism42/infra/b300/services/fish-speech/.venv-nightly/bin/vllm serve nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4 \
    --served-model-name nemotron-nano \
    --trust-remote-code \
    --tensor-parallel-size 1 \
    --max-model-len 32768 \
    --max-num-seqs 8 \
    --gpu-memory-utilization 0.85 \
    --kv-cache-dtype fp8 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser-plugin /opt/prism42/infra/b300/services/vllm/nano_v3_reasoning_parser.py \
    --reasoning-parser nano_v3 \
    --enable-prefix-caching \
    --speculative-config '{"method":"ngram","num_speculative_tokens":3,"prompt_lookup_max":4,"prompt_lookup_min":2}' \
    --port 8001 \
    --host 127.0.0.1

# Process supervision: restart on failure but not on clean exit (so we can
# stop/start manually without auto-restart races).
Restart=on-failure
RestartSec=10
TimeoutStartSec=600
TimeoutStopSec=60

# Run as the same user that owns the venv + checkpoints
User=shadeform
Group=shadeform
WorkingDirectory=/opt/prism42

# Logging to a persistent file matches today's behavior:
StandardOutput=append:/tmp/prism42-logs/vllm.log
StandardError=append:/tmp/prism42-logs/vllm.log
