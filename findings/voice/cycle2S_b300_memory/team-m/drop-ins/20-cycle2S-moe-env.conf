# /etc/systemd/system/prism42-vllm.service.d/20-cycle2S-moe-env.conf
#
# Cycle-2S+ Lever L8b: persist NVFP4 MoE backend env vars in systemd.
#
# Why: today these env vars live in the parent shell of the manual `vllm serve`
# (PID 389310, shell-launched). If vLLM is restarted from a fresh shell, the env
# vars vanish, FlashInfer auto-selects TRTLLM, MoE pads hidden_size 2688 → 2816,
# output is JS-garbage. Memory finding #6.
#
# Effect: operational. Eliminates a latent prod-down bug.
#
# Activation: install + daemon-reload + restart. Verify env post-restart with
# `cat /proc/$(pgrep -f "vllm serve")/environ | tr '\0' '\n' | grep -E "^(VLLM|TORCH)"`.

[Service]
# NVFP4 MoE backend = FLASHINFER_CUTLASS (NOT TRTLLM)
Environment="VLLM_USE_FLASHINFER_MOE_FP4=1"
Environment="VLLM_FLASHINFER_MOE_BACKEND=throughput"

# FlashInfer attention backend (correct for sm_103)
Environment="VLLM_ATTENTION_BACKEND=FLASHINFER"

# Compile NVFP4 + FA4 cute kernels for both Blackwell sm_100 (B200) and sm_103 (B300)
Environment="TORCH_CUDA_ARCH_LIST=10.0;10.3"

# Force-disable observability features that add per-iter overhead
# (kv_cache_metrics_sample is already 0.01 = 1%, fine)

# Optional: set HF_TOKEN to avoid the unauthenticated-rate-limits warning at startup.
# Uncomment + populate before installing.
# Environment="HF_TOKEN=hf_xxx"
