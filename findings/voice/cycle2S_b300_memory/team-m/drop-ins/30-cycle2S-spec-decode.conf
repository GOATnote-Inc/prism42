# /etc/systemd/system/prism42-vllm.service.d/30-cycle2S-spec-decode.conf
#
# Cycle-2S+ Lever L6: enable n-gram speculative decoding for PSAP-style outputs.
#
# Why: PSAP responses are JSON-envelope-heavy with repetitive surface forms
# ("intent": "emergency", "severity": N, etc.). N-gram speculation tables learn
# these online and validate 2-4 tokens per forward pass. Decode speedup 1.3-1.5x.
# No draft model needed. vLLM blog cites 1.3-1.7x with async-scheduling +
# spec-decoding combined; async-scheduling is already on.
#
# Effect: inter-token latency 3.2 ms -> ~2.4 ms; tokens/s 313 -> ~420.
# 50-token PSAP reply: ~40 ms faster end-to-end.
#
# Risk MED: NemotronH is hybrid Mamba+Transformer. If spec-decode on Mamba layers
# fails, vLLM should fall back. Pre-flight: send 5 probe requests post-restart;
# confirm `vllm:spec_decode_num_accepted_tokens_total` is non-zero.
#
# Activation: this drop-in modifies ExecStart; install AFTER 10-cycle2S-gpu-memory.conf
# (their ExecStart= overrides will need to be MERGED — see README.md combined-conf).

[Service]
# Append to the existing ExecStart from the gpu-memory drop-in
# n-gram window 2-4, propose 3 tokens per step
ExecStart=
ExecStart=/opt/prism42/infra/b300/services/fish-speech/.venv-nightly/bin/vllm serve nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-NVFP4 \
    --served-model-name nemotron-nano \
    --trust-remote-code \
    --tensor-parallel-size 1 \
    --max-model-len 32768 \
    --max-num-seqs 8 \
    --gpu-memory-utilization 0.85 \
    --kv-cache-dtype fp8 \
    --enable-auto-tool-choice \
    --tool-call-parser qwen3_coder \
    --reasoning-parser-plugin /opt/prism42/infra/b300/services/vllm/nano_v3_reasoning_parser.py \
    --reasoning-parser nano_v3 \
    --enable-prefix-caching \
    --speculative-config '{"method":"ngram","num_speculative_tokens":3,"prompt_lookup_max":4,"prompt_lookup_min":2}' \
    --port 8001 \
    --host 127.0.0.1
