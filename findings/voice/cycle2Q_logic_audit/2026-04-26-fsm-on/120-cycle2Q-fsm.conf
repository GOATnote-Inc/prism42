# cycle-2Q FSM activation drop-in (2026-04-26)
#
# Enables the dispatcher finite-state machine in front of Nemotron.
# FSM owns safety-critical intent selection (cardiac arrest verification
# gate, pronoun discipline, anti-repetition latches); LLM owns phrasing
# only. See findings/voice/cycle2Q_logic_audit/2026-04-26-team3/fsm-design.md.
#
# Default-OFF code path remains intact; this drop-in is the env-flip.
# Rollback: rm this file + daemon-reload + restart prism42-worker.

[Service]
Environment="PRISM42_ENABLE_FSM=1"
