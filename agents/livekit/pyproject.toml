[project]
name = "prism42-livekit-agent"
version = "0.1.0"
description = "Prism42 voice-agent worker — orchestrator + 14 PSAP specialists on livekit-agents 1.5.6, Parakeet STT + Fish Speech S2 Pro TTS, fully self-hosted on B300."
authors = [{ name = "GOATnote Inc.", email = "b@thegoatnote.com" }]
requires-python = ">=3.11"
license = { text = "MIT" }

# Pin floors known-good against livekit-agents 1.5.6 (April 2026).
# NO cloud STT/TTS plugins — Parakeet + Fish Speech run on the pod
# and are invoked via thin custom subclasses of livekit.agents.stt.STT
# and livekit.agents.tts.TTS (see parakeet_stt.py + fish_speech_tts.py).
dependencies = [
    "livekit-agents[anthropic,openai,silero,turn-detector]>=1.5.6,<2",
    "anthropic>=0.97.0",
    "openai>=1.50.0",
    "aiohttp>=3.9.0",  # WebSocket client for Parakeet /ws streaming STT
    "httpx>=0.27.0",
    "numpy>=1.26.0",
    "redis>=5.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prism42"]
