[project]
name = "prism42-livekit-agent"
version = "0.1.0"
description = "Prism42 voice-agent worker — orchestrator + 14 PSAP specialists on livekit-agents 1.5.6"
authors = [{ name = "GOATnote Inc.", email = "b@thegoatnote.com" }]
requires-python = ">=3.11"
license = { text = "MIT" }

# Pin floors known-good against livekit-agents 1.5.6 (April 2026).
# Plugin versions are sub-pinned by the framework; we pin the
# top-level for reproducibility.
dependencies = [
    "livekit-agents[anthropic,openai,deepgram,cartesia,silero,turn-detector]>=1.5.6,<2",
    "anthropic>=0.97.0",
    "openai>=1.50.0",
    "redis>=5.0.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.7.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["prism42"]
