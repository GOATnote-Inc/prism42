# 5-role activation drop-in (2026-04-27)
#
# Enables Guardrails input rail + Attacker probe + rule_adjudicator —
# all fire-and-forget, structlog-only Phase 1 observability. Default
# OFF in code; this drop-in is the env-flip.
#
# Output flows ONLY to structlog (event names: "guardrails.check",
# "attacker.probe", "adjudicator.rule"). The audio path is not
# affected — none of these mutate FSM state, chat_ctx, or session
# audio. See findings/research/2026-04-27-future-stack/voice-5role-design.md
# §1, §3, §5 for the off-path-safety invariants and the unit tests
# at tests/voice/test_{attacker,rule_adjudicator,guardrails_wrapper}.py
# that lock them.
#
# Rollback (if a clinical issue surfaces in attestation):
#   sudo rm /etc/systemd/system/prism42-worker.service.d/130-5role-enable.conf
#   sudo systemctl daemon-reload
#   sudo systemctl restart prism42-worker

[Service]
Environment="PRISM42_ENABLE_GUARDRAILS=1"
Environment="PRISM42_ENABLE_ATTACKER=1"
Environment="PRISM42_ENABLE_RULE_ADJUDICATOR=1"
Environment="PRISM42_ADJUDICATOR_SAMPLE_RATE=0.05"
# Deterministic dispatch scoping: when set, the worker only accepts
# jobs that explicitly request agent_name=prism42-h100 (via livekit-cli
# --agent-name or the Playground "Agent Name" field). Default-dispatch
# jobs go to other workers (e.g. the H200 worker on the same Cloud).
# Unset this Environment line to revert to default-dispatch behavior.
Environment="PRISM42_AGENT_NAME=prism42-h100"
