# prism42-elevenlabs — ElevenLabs ConvAI agent config.
#
# Consumed by scripts/register_elevenlabs_agent.py. Pushed to
# ElevenLabs either as a fresh create (POST /v1/convai/agents/create)
# or a patch to an existing agent (PATCH /v1/convai/agents/:id) when
# agents/elevenlabs-manifest.yaml already carries an agent id.
#
# Design note: the ElevenLabs-side prompt is intentionally minimal.
# All PSAP logic lives in the Custom LLM backend at
# https://prism42-console.vercel.app/prism42/api/chat/completions.
# The custom-LLM endpoint REPLACES the inbound system prompt with
# its own 14-agent coordinator prompt, so the only load-bearing
# thing we need from this file is:
#   1. The Session-ID template line (so our endpoint can parse
#      session_id out of messages[0].content).
#   2. The LLM selection set to "custom-llm" with our URL.
#
# Other ElevenLabs-side settings (voice, turn timeout, ASR provider,
# max duration) are cosmetic and can be left at ElevenLabs defaults
# or overridden by the user in the dashboard — PATCH only writes
# the fields listed here, so anything the user configures in the
# dashboard (like the "Eric - Smooth, Trustworthy" voice pick) is
# preserved across re-runs.

_prism:
  role: prism42-elevenlabs-voice-layer
  purpose: ElevenLabs ConvAI voice I/O; custom-LLM backend owns all PSAP logic
  version: 0.1.0
  author: GOATnote Inc. (under direction of Brandon Dent, MD)
  last_updated: 2026-04-23
  custom_llm_url: https://prism42-console.vercel.app/prism42/api/chat/completions

name: prism42

# The keys below map 1:1 to the POST/PATCH body. agent_config and
# conversation_config are both at the top level — NOT nested under a
# wrapper — per the API shape.

agent_config:
  language: en

  prompt:
    # System prompt — this is what ElevenLabs puts in messages[0] of
    # the Custom LLM call. Our endpoint ignores the semantic content
    # and uses its own COORDINATOR_SYSTEM_PROMPT; the only thing
    # actually consumed is the Session-ID line, which we parse with
    # SESSION_ID_FROM_SYSTEM in app/prism42/api/chat/completions/
    # route.ts.
    prompt: |
      You are the voice layer of a public 911-style PSAP simulation
      at www.thegoatnote.com/prism42. All decisions come from the
      Custom LLM backend. Speak exactly what the backend returns;
      do not embellish, do not interpret, do not substitute
      clinical judgment.

      Session-ID: {{session_id}}

      Simulation disclosure: this is NOT a real emergency line. If
      the caller appears to be reporting a real emergency, the
      backend will instruct you to direct them to hang up and dial
      911 on a working phone.

    llm: custom-llm
    custom_llm:
      url: https://prism42-console.vercel.app/prism42/api/chat/completions
      model_id: prism42-coordinator
      api_type: chat_completions
      # api_key intentionally omitted — the endpoint is public (no
      # auth). If auth is added later (Phase 2b Turnstile + bearer),
      # create an ElevenLabs secret in the dashboard then set:
      #   api_key: { secret_id: "<secret-id>" }

  dynamic_variables:
    dynamic_variable_placeholders:
      session_id: "dev-placeholder"

conversation_config:
  asr:
    provider: elevenlabs
    quality: high

  turn:
    turn_timeout: 7
    turn_eagerness: normal

  tts:
    model_id: eleven_flash_v2
    stability: 0.5
    similarity_boost: 0.8

  conversation:
    max_duration_seconds: 600   # 10-min session hard cap (SP-007)
