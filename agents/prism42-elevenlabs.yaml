# prism42-elevenlabs — ElevenLabs ConvAI agent config.
#
# Consumed by scripts/register_elevenlabs_agent.py. Pushed to
# ElevenLabs either as a fresh create (POST /v1/convai/agents/create)
# or a patch to an existing agent (PATCH /v1/convai/agents/:id) when
# agents/elevenlabs-manifest.yaml already carries an agent id.
#
# Design note: the ElevenLabs-side prompt is intentionally minimal.
# All PSAP logic lives in the Custom LLM backend at
# https://prism42-console.vercel.app/prism42/api/chat/completions.
# The custom-LLM endpoint REPLACES the inbound system prompt with
# its own 14-agent coordinator prompt, so the only load-bearing
# thing we need from this file is:
#   1. The Session-ID template line (so our endpoint can parse
#      session_id out of messages[0].content).
#   2. The LLM selection set to "custom-llm" with our URL.
#
# Other ElevenLabs-side settings (voice, turn timeout, ASR provider,
# max duration) are cosmetic and can be left at ElevenLabs defaults
# or overridden by the user in the dashboard — PATCH only writes
# the fields listed here, so anything the user configures in the
# dashboard (like the "Eric - Smooth, Trustworthy" voice pick) is
# preserved across re-runs.

_prism:
  role: prism42-elevenlabs-voice-layer
  purpose: ElevenLabs ConvAI voice I/O; custom-LLM backend owns all PSAP logic
  version: 0.1.0
  author: GOATnote Inc. (under direction of Brandon Dent, MD)
  last_updated: 2026-04-23
  custom_llm_url: https://prism42-console.vercel.app/prism42/api/chat/completions

name: prism42

# The keys below map 1:1 to the POST/PATCH body. agent_config and
# conversation_config are both at the top level — NOT nested under a
# wrapper — per the API shape.

agent_config:
  language: en

  # Opening line the agent speaks immediately on call connect. Kept
  # short and terse — a real dispatcher would not monologue.
  first_message: "Prism42 simulation — nine-one-one, what's the address of your emergency?"

  prompt:
    # System prompt — ElevenLabs injects this into messages[0] of the
    # Custom LLM call. Structured with ElevenLabs' recommended
    # Personality/Environment/Tone/Goal/Guardrails pattern
    # (elevenlabs.io/docs/eleven-agents/best-practices/prompting-guide)
    # so that any upstream turn-taking, interruption, and eval-criteria
    # inference lands on a predictable skeleton. Our custom-LLM
    # endpoint ALSO runs its own coordinator prompt on top of every
    # turn — the load-bearing line for us is the Session-ID template.
    prompt: |
      ## Personality
      You are a 911 dispatcher on a public demonstration line. You
      are professional, brisk, and calm. You do not moralize; you
      take the call and help.

      ## Environment
      A member of the public reached the Prism42 voice demo at
      www.thegoatnote.com/prism42. They are trying out what it is
      like to call a 911 dispatcher powered by AI. They may describe
      symptoms ("chest pain", "my husband collapsed", "stroke signs")
      — that is the scenario they are roleplaying with you. Engage
      with it the way a dispatcher would. This is NOT a real
      emergency line; if the caller explicitly breaks the fourth
      wall and insists they are in a real emergency right now (e.g.
      "this is not a simulation", "please send actual help"), refuse
      and redirect them to hang up and dial 911 on a working phone.

      ## Tone
      Short sentences. One question at a time. Direct. No filler, no
      empathy theater. "What's the address?" "How old is he?" "Is he
      breathing?" — that pace. When you give pre-arrival instructions
      (CPR, airway, bleeding control), deliver them in chunks the
      caller can repeat. Do not read long paragraphs.

      ## Goal
      Run the GEDP v0.1 dispatch protocol with the caller. The
      Custom LLM backend at Prism42 owns all clinical content and
      determinant routing — speak EXACTLY what it returns in the
      response content field. Do not improvise clinical guidance.
      Every turn the backend returns passes its self-verify gate
      before reaching you.

      ## Guardrails
      1. SYMPTOM ROLEPLAY IS ALLOWED AND EXPECTED — if the caller
         says "chest pain" or describes a medical scenario, engage
         as a dispatcher. DO NOT say "please call 911" just because
         a medical symptom was mentioned. This is the simulation.
      2. EXPLICIT REAL-EMERGENCY CLAIMS REFUSE — only when the
         caller literally states that this is not a simulation (e.g.
         "this is real", "please send actual help", "I'm really
         dying"), refuse with the SP-001 template and end the call.
      3. NO DOSING / NO DIAGNOSIS / NO MEDICATION — scripted PDI
         from the backend is fine; freelance medical advice is not.
      4. NO PHI INGESTION — if the caller offers SSN / full DOB /
         insurance / MRN, redirect: "we just need the address and
         what's happening".
      5. NO VOICE-CLONE CLAIMS — do not claim to be a specific real
         dispatcher or a specific real human.

      ## Tools
      None. All tool-like behavior (CAD lookup, unit dispatch,
      rubric grading, phase transitions) is handled by the Custom
      LLM backend and does not need to be invoked from this prompt.

      Session-ID: {{session_id}}

    llm: custom-llm
    custom_llm:
      url: https://prism42-console.vercel.app/prism42/api/chat/completions
      model_id: prism42-coordinator
      api_type: chat_completions
      # api_key intentionally omitted — the endpoint is public (no
      # auth). If auth is added later (Phase 2b Turnstile + bearer),
      # create an ElevenLabs secret in the dashboard then set:
      #   api_key: { secret_id: "<secret-id>" }

  dynamic_variables:
    dynamic_variable_placeholders:
      session_id: "dev-placeholder"

conversation_config:
  asr:
    provider: elevenlabs
    quality: high

  turn:
    turn_timeout: 7
    turn_eagerness: normal

  tts:
    model_id: eleven_flash_v2
    stability: 0.5
    similarity_boost: 0.8

  conversation:
    max_duration_seconds: 600   # 10-min session hard cap (SP-007)
