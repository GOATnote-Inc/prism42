# Version updates are disabled (open-pull-requests-limit: 0): this repository is in
# passive maintenance. Dependabot SECURITY updates are configured at the repository
# level and still open PRs for real vulnerabilities.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
- package-ecosystem: npm
  directory: /mvp/911-console-live
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
- package-ecosystem: pip
  directory: /mla
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
- package-ecosystem: pip
  directory: /music-video
  schedule:
    interval: weekly
  open-pull-requests-limit: 0
