name: voice regression tests

# Least privilege: both jobs only read the repo. The integration job's
# pod SSH uses repo secrets, not the GITHUB_TOKEN.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration:
        description: "Run integration tests (needs pod SSH key)"
        required: false
        default: "false"

jobs:
  unit:
    name: unit (parser sanity)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pyyaml structlog httpx
      - name: run unit tests
        run: pytest tests/voice -v -m "not integration"

  integration:
    name: integration (pod SSH + bench)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_integration == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pyyaml structlog httpx
      - name: configure SSH to pod
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BREV_PEM }}" > ~/.ssh/brev.pem
          chmod 600 ~/.ssh/brev.pem
          cat > ~/.ssh/config <<EOF
          Host b300-pod
            HostName ${{ secrets.POD_HOSTNAME }}
            User shadeform
            IdentityFile ~/.ssh/brev.pem
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
      - name: run integration tests
        run: pytest tests/voice -v -m integration --tb=short
        timeout-minutes: 10
