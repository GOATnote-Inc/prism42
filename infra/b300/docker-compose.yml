# Docker compose for the LiveKit server + Redis + (later) vLLM on
# the B300 pod. Caddy and the Python agent worker run on the host
# (not in containers) so they can use systemd auto-restart cleanly.
#
# Bring up after setup.sh has installed Docker + the agent venv:
#   cd /opt/prism42/infra/b300
#   docker compose --env-file /opt/prism42/.env up -d

services:

  livekit:
    image: livekit/livekit-server:v1.9.0
    restart: unless-stopped
    network_mode: host
    # `network_mode: host` is REQUIRED for WebRTC on Linux pods —
    # bridge networking mangles ICE candidates and breaks media flow.
    # Trade-off: container ports are not isolated from the host; we
    # rely on the pod's firewall (open: 7880 tcp, 7881 tcp, 7882 udp,
    # 443 udp for TURN, 5349 tcp for TURN/TLS).
    volumes:
      - ./livekit.yaml:/livekit.yaml:ro
    command: --config /livekit.yaml
    environment:
      - LIVEKIT_API_KEY
      - LIVEKIT_API_SECRET

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    network_mode: host
    # Redis is not exposed publicly — bind to 127.0.0.1 in
    # redis.conf. Default config is fine for a single-pod demo.
    command: redis-server --bind 127.0.0.1 --port 6379 --maxmemory 256mb --maxmemory-policy allkeys-lru

  # ------------------------------------------------------------------
  # Parakeet ASR service — NVIDIA's Parakeet via NeMo, wrapped in a
  # FastAPI server. Exposes POST /transcribe on 127.0.0.1:9100.
  # Dockerfile: infra/b300/services/parakeet/Dockerfile.
  # Rationale: ~6× faster than accuracy-leader STTs; accuracy already
  # above the practical ceiling for voice agents (user 2026-04-23).
  # ------------------------------------------------------------------
  parakeet:
    build:
      context: ./services/parakeet
    restart: unless-stopped
    network_mode: host
    environment:
      - MODEL=${PARAKEET_MODEL:-nvidia/parakeet-tdt-0.6b-v3}
      - BIND=127.0.0.1
      - PORT=9100
      - HF_HOME=/models/hf
    volumes:
      - /opt/prism42/models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # ------------------------------------------------------------------
  # Fish Speech S2 Pro TTS on SGLang. Exposes POST /tts on
  # 127.0.0.1:9200 with PCM16 streaming chunks (24 kHz mono).
  # Dockerfile: infra/b300/services/fish-speech/Dockerfile.
  # Rationale: beats ElevenLabs on 2 of 3 major quality benchmarks,
  # ~100 ms TTFA on H200, faster on B300 (user 2026-04-23).
  # ------------------------------------------------------------------
  fish-speech:
    build:
      context: ./services/fish-speech
    restart: unless-stopped
    network_mode: host
    environment:
      - MODEL=fishaudio/s2-pro
      - BACKEND=sglang
      - BIND=127.0.0.1
      - PORT=9200
      - HF_HOME=/models/hf
    volumes:
      - /opt/prism42/models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

